[agent]
  interval = "1s"
  round_interval = true

[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["+/+/+/+/+"]
  data_format = "value"
  data_type = "float"

  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "+/+/+/+/+"
    measurement = "_/_/_/_/measurement"
    tags = "sid/ist/devid/source/_"

[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics  = ["+/debug"]

  data_format = "json"
  json_string_fields = ["msg", "tag", "level", "fw"]

  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "+/+"
    tags  = "device/source"


[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "d8Ls5JW9I-HrggHSvtp4gV0rtSOULmwFA-TNZBLNL6rcCPBqGliesFvr3mMp3MPkpbY9Vc0Y_Qa9uwV1xIn60A=="
  organization = "koole"
  bucket = "mqtt"

[[outputs.loki]]
  endpoint = "http://loki:3100/loki/api/v1/push"
  label_keys = ["device", "source", "tag", "level", "fw"]
  message_key = "msg"
  timestamp_key = "ts"
  timestamp_format = "unix_ms"
  