services:
  loki:
    image: grafana/loki:2.9.8
    container_name: loki
    user: "0:0"
    restart: unless-stopped
    command: -config.file=/etc/loki/config.yml
    ports:
      - "3100:3100"
    volumes:
      - ./config/:/etc/loki/
      - ${DATA}/loki:/loki
    networks:
      - ingress-network

networks:
  ingress-network:
    external: true
